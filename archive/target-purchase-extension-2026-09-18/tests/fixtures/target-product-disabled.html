<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Target product waiting simulation</title>
  </head>
  <body>
    <main>
      <section data-test="module-product-detail-add-to-cart">
        <button id="purchase" disabled>Add to cart</button>
      </section>
    </main>
    <script>
      window.__purchaseClicks = 0;
      document.getElementById("purchase").addEventListener("click", () => {
        window.__purchaseClicks += 1;
      });
    </script>
  </body>
</html>
