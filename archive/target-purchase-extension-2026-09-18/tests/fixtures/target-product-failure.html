<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Target product add failure</title>
  </head>
  <body>
    <main>
      <section data-test="module-product-detail-add-to-cart">
        <button id="purchase">Add to cart</button>
      </section>
      <div id="result"></div>
    </main>
    <script>
      window.__purchaseClicks = 0;
      document.getElementById("purchase").addEventListener("click", () => {
        window.__purchaseClicks += 1;
        document.getElementById("result").innerHTML =
          '<div role="dialog">Item not added to cart <a href="/cart">View cart & check out</a></div>';
      });
    </script>
  </body>
</html>
