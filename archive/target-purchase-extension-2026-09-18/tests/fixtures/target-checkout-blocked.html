<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Target checkout safety simulation</title>
  </head>
  <body>
    <main>
      <h2>Cart total • 1 item</h2>
      <div data-test="cartItem" data-item-id="A-9999999999">
        <a href="/p/unrecognized/-/A-9999999999">Unrecognized product</a>
        <select aria-label="Quantity">
          <option value="1" selected>1</option>
        </select>
      </div>
      <button id="place-order">Place your order</button>
    </main>
    <script>
      window.__placeOrderClicks = 0;
      document.getElementById("place-order").addEventListener("click", () => {
        window.__placeOrderClicks += 1;
      });
    </script>
  </body>
</html>
