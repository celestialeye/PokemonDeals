<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Target checkout simulation</title>
  </head>
  <body>
    <main>
      <h2>Cart total • 1 item</h2>
      <div data-test="cartItem" data-item-id="A-1010892065">
        <a href="/p/simulated/-/A-1010892065">Simulated Pokémon product</a>
        <select aria-label="Quantity">
          <option value="1" selected>1</option>
        </select>
      </div>
      <button id="place-order">Place your order</button>
      <div id="result"></div>
    </main>
    <script>
      window.__placeOrderClicks =
        Number(localStorage.getItem("placeOrderClicks")) || 0;
      document.getElementById("place-order").addEventListener("click", () => {
        window.__placeOrderClicks += 1;
        localStorage.setItem(
          "placeOrderClicks",
          String(window.__placeOrderClicks),
        );
        document.getElementById("place-order").disabled = true;
        location.assign("/co-thankyou?order=SIMULATED");
      });
    </script>
  </body>
</html>
